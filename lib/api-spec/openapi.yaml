openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Imperial clothing store API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product catalog
  - name: cart
    description: Shopping cart
  - name: auth
    description: Authentication
  - name: orders
    description: Orders & tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: collection
          in: query
          required: false
          schema:
            type: string
        - name: first
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{handle}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by handle
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found

  /collections:
    get:
      operationId: listCollections
      tags: [products]
      summary: List collections
      responses:
        "200":
          description: Collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collection"

  /cart:
    post:
      operationId: createCart
      tags: [cart]
      summary: Create a new cart
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartCreateInput"
      responses:
        "201":
          description: Cart created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/{cartId}:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get cart by ID
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "404":
          description: Not found

  /cart/{cartId}/lines:
    post:
      operationId: addCartLine
      tags: [cart]
      summary: Add item to cart
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartLineInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/{cartId}/lines/{lineId}:
    patch:
      operationId: updateCartLine
      tags: [cart]
      summary: Update cart line quantity
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartLineUpdate"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: removeCartLine
      tags: [cart]
      summary: Remove item from cart
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
        "409":
          description: Email already exists

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummary"
        "401":
          description: Unauthorized

    get:
      operationId: listOrders
      tags: [orders]
      summary: List my orders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSummary"
        "401":
          description: Unauthorized

  /orders/{orderNumber}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by number
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetails"
        "404":
          description: Order not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required:
        - name
        - email
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    User:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
      required:
        - id
        - name
        - email

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required:
        - user
        - token

    CreateOrderRequest:
      type: object
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
          format: email
        shippingAddress:
          type: string
        totalAmount:
          type: number
        items:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              variant:
                type: string
              quantity:
                type: integer
              price:
                type: number
        currency:
          type: string
          default: PHP
      required:
        - customerName
        - customerEmail
        - shippingAddress
        - totalAmount
        - items

    OrderSummary:
      type: object
      properties:
        orderNumber:
          type: string
        status:
          type: string
        totalAmount:
          type: number
        currency:
          type: string
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
        timeline:
          type: array
          items:
            type: object
      required:
        - orderNumber
        - status
        - totalAmount
        - currency

    OrderDetails:
      type: object
      properties:
        orderNumber:
          type: string
        status:
          type: string
        totalAmount:
          type: number
        currency:
          type: string
        customerName:
          type: string
        customerEmail:
          type: string
        shippingAddress:
          type: string
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
        timeline:
          type: array
          items:
            type: object
      required:
        - orderNumber
        - status
        - totalAmount
        - currency

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Money:
      type: object
      properties:
        amount:
          type: string
        currencyCode:
          type: string
      required:
        - amount
        - currencyCode

    PriceRange:
      type: object
      properties:
        minVariantPrice:
          $ref: "#/components/schemas/Money"
        maxVariantPrice:
          $ref: "#/components/schemas/Money"
      required:
        - minVariantPrice
        - maxVariantPrice

    ProductImage:
      type: object
      properties:
        url:
          type: string
        altText:
          type: ["string", "null"]
      required:
        - url

    SelectedOption:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required:
        - name
        - value

    ProductVariant:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        availableForSale:
          type: boolean
        selectedOptions:
          type: array
          items:
            $ref: "#/components/schemas/SelectedOption"
      required:
        - id
        - title
        - price
        - availableForSale
        - selectedOptions

    Product:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        handle:
          type: string
        description:
          type: string
        featuredImage:
          $ref: "#/components/schemas/ProductImage"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        priceRange:
          $ref: "#/components/schemas/PriceRange"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
        tags:
          type: array
          items:
            type: string
        productType:
          type: string
      required:
        - id
        - title
        - handle
        - description
        - priceRange
        - variants
        - tags
        - productType

    Collection:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        handle:
          type: string
        description:
          type: string
        image:
          $ref: "#/components/schemas/ProductImage"
      required:
        - id
        - title
        - handle
        - description

    CartLineInput:
      type: object
      properties:
        merchandiseId:
          type: string
        quantity:
          type: integer
      required:
        - merchandiseId
        - quantity

    CartLineUpdate:
      type: object
      properties:
        quantity:
          type: integer
      required:
        - quantity

    CartCreateInput:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CartLineInput"

    CartLineMerchandise:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        product:
          $ref: "#/components/schemas/Product"
        selectedOptions:
          type: array
          items:
            $ref: "#/components/schemas/SelectedOption"
        image:
          $ref: "#/components/schemas/ProductImage"
      required:
        - id
        - title
        - product
        - selectedOptions

    CartLineCost:
      type: object
      properties:
        totalAmount:
          $ref: "#/components/schemas/Money"
      required:
        - totalAmount

    CartLine:
      type: object
      properties:
        id:
          type: string
        quantity:
          type: integer
        merchandise:
          $ref: "#/components/schemas/CartLineMerchandise"
        cost:
          $ref: "#/components/schemas/CartLineCost"
      required:
        - id
        - quantity
        - merchandise
        - cost

    CartCost:
      type: object
      properties:
        totalAmount:
          $ref: "#/components/schemas/Money"
        subtotalAmount:
          $ref: "#/components/schemas/Money"
      required:
        - totalAmount
        - subtotalAmount

    Cart:
      type: object
      properties:
        id:
          type: string
        checkoutUrl:
          type: string
        totalQuantity:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CartLine"
        cost:
          $ref: "#/components/schemas/CartCost"
      required:
        - id
        - checkoutUrl
        - totalQuantity
        - lines
        - cost
